<div class="block">
    <h1>{{title()}}</h1>
    @if (decoratorImage(); as decorator) {
        <img class="decorator" [src]="decorator.src" [alt]="decorator.alt"/>
    }
    <div
        class="content"
        [class.has-image]="image()"
        [class.image-left]="imagePosition() === 'left'"
    >
        <ng-content select="p,article"/>

        @if (image(); as imageSource) {
            <img
                class="content-image"
                [src]="imageSource"
                [alt]="altText()"
                [class.image-left]="imagePosition() === 'left'"
            />
        }
    </div>
</div>
